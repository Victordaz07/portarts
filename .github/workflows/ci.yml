name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    env:
      # The app degrades gracefully with no backend configured, so CI needs no
      # real secrets. A dummy AUTH_SECRET keeps Auth.js from erroring on init.
      AUTH_SECRET: ci-dummy-secret-not-used-in-production
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        # Pre-existing lint findings are non-blocking; don't fail CI on them.
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Start server and run smoke tests
        # A backgrounded process does not survive across steps, so start the
        # server, wait for it, run the smoke suite, and stop it in one step.
        run: |
          npm run start &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000; then break; fi
            sleep 1
          done
          npm run test:smoke
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS
